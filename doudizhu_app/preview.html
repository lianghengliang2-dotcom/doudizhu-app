<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#151515">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>斗地主记分 - 交互预览</title>
  <style>
    :root {
      --bg: #151515; --phone: #090909; --panel: #18130f; --card: #201914;
      --gold: #e2b84b; --gold-soft: #8b6914; --red: #c82121; --text: #f5e6c8;
      --muted: #a28c70; --green: #4caf6a; --blue: #4185d7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .preview-shell { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .preview-menu-handle { position: fixed; top: env(safe-area-inset-top); left: 50%; z-index: 42; width: 54px; height: 24px; min-height: 44px; transform: translateX(-50%); padding: 0; border: 0; background: transparent; color: var(--muted); }
    .handle-bar { display: block; width: 30px; height: 4px; margin: 5px auto; border-radius: 999px; background: var(--gold-soft); }
    .tab-bar { position: fixed; top: 0; left: 50%; z-index: 41; width: min(100%, 460px); margin: 0; padding: calc(22px + env(safe-area-inset-top)) 8px 8px; transform: translate(-50%, -110%); opacity: 0; pointer-events: none; background: #090909f5; border-bottom: 1px solid var(--gold-soft); box-shadow: 0 12px 30px #000a; transition: transform .18s ease, opacity .18s ease; }
    .tab-bar.open { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
    .tab-bar button { padding: 8px 15px; border: 1px solid var(--gold-soft); border-radius: 8px; background: #1c1410; color: var(--text); font-weight: 700; }
    .tab-bar button:hover, .tab-bar button.active { border-color: var(--gold); }
    .tab-bar button.active { background: var(--red); }
    .phone { width: min(100%, 430px); min-height: 690px; margin: 0 auto; border: 3px solid #303030; border-radius: 26px; overflow: hidden; background: var(--phone); box-shadow: 0 20px 70px #0008; }
    .screen { display: none; min-height: 684px; }
    .screen.active { display: block; }
    .app-bar { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid #282018; }
    .app-bar h1 { margin: 0; font-size: 21px; }
    .actions { display: flex; gap: 8px; }
    .icon-btn, .back-btn { border: 1px solid #3b3025; border-radius: 9px; padding: 7px 10px; background: #16110d; color: var(--text); }
    .content { padding: 18px; }
    .hero { min-height: 545px; display: grid; place-content: center; text-align: center; gap: 12px; }
    .hero-symbol { font-size: 48px; }
    .hero h2 { margin: 0; color: var(--gold); font-size: 27px; }
    .hero p, .hint, .muted { color: var(--muted); }
    .primary, .danger, .secondary { border-radius: 12px; padding: 12px 18px; font-weight: 800; }
    .primary { border: 1px solid #ef4438; background: var(--red); color: white; }
    .secondary { border: 1px solid var(--gold-soft); background: #1b1510; color: var(--text); }
    .danger { border: 1px solid #6c2929; background: #321515; color: #ffb1aa; }
    .wide { width: 100%; }
    .card { background: var(--card); border: 1px solid #3a2d22; border-radius: 14px; padding: 14px; }
    .section-title { margin: 18px 0 9px; color: var(--gold); font-size: 15px; }
    .score-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .score-card { position: relative; overflow: hidden; text-align: center; padding: 15px 7px 13px; border-top: 4px solid var(--player-color); background: linear-gradient(180deg, #282018 0, var(--card) 34%); }
    .player-name { display: inline-flex; align-items: center; justify-content: center; gap: 7px; color: #fff4df; font-size: 18px; font-weight: 900; letter-spacing: .04em; }
    .player-name::before { content: ""; width: 9px; height: 9px; flex: 0 0 9px; border-radius: 50%; background: var(--player-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--player-color) 25%, transparent); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 7px; color: white; font-weight: 900; }
    .score { margin-top: 7px; font-size: 27px; line-height: 1; font-weight: 900; font-variant-numeric: tabular-nums; }
    .score.positive { color: #f2c95f; }
    .score.negative { color: #72cda1; }
    .score.zero { color: var(--muted); }
    .toolbar { display: flex; gap: 8px; margin: 12px 0; }
    .toolbar > * { flex: 1; }
    .round-row, .history-item { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 8px; }
    .empty-card { text-align: center; color: var(--muted); padding: 20px; }
    .player-list { display: grid; gap: 9px; }
    .player-item { display: flex; align-items: center; gap: 11px; cursor: pointer; transition: .15s; }
    .player-item.checked { border-color: var(--gold); background: #2a2117; }
    .player-item .check-icon { margin-left: auto; color: var(--gold); font-size: 20px; }
    .selection-status { min-height: 24px; text-align: center; margin: 12px 0; color: var(--muted); }
    .option-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .btn-option { border: 1px solid #4a3a2b; background: #17120f; color: var(--text); border-radius: 10px; padding: 10px 6px; text-align: center; }
    .btn-option.selected { border-color: var(--gold); background: #392b14; color: #ffe79a; }
    .btn-option.landlord-option { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-top: 3px solid var(--player-color); padding: 8px 6px 10px; }
    .btn-option.landlord-option.selected { border-top-color: var(--player-color); }
    .player-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--player-color); box-shadow: 0 0 0 3px color-mix(in srgb, var(--player-color) 24%, transparent); }
    .player-label { font-weight: 700; }
    .toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .toggle { border: 1px solid #4a3a2b; background: #17120f; color: var(--text); border-radius: 10px; padding: 10px; }
    .toggle.selected { background: var(--red); border-color: #ef4438; }
    .check-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .check-row label { flex: 1; min-width: 100px; border: 1px solid #3b3025; border-radius: 10px; padding: 10px; background: #17120f; }
    .bomb-row { display: flex; justify-content: center; align-items: center; gap: 16px; }
    .bomb-row button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold-soft); background: #17120f; color: var(--text); font-size: 20px; }
    .recent-rounds-toggle { width: 100%; min-height: 42px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; border: 1px solid #3a2d22; border-radius: 12px; padding: 8px 12px; background: var(--card); color: var(--text); text-align: left; }
    .recent-rounds-label { color: var(--gold); font-weight: 800; }
    .recent-rounds-summary { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); text-align: right; }
    .recent-rounds-toggle[aria-expanded="true"] .disclosure-icon { transform: rotate(180deg); }
    .bomb-control-row { display: flex; min-height: 44px; align-items: center; justify-content: space-between; gap: 12px; }
    .bomb-control-row .bomb-row { gap: 12px; }
    .preview-score { text-align: center; font-size: 19px; color: var(--gold); padding: 13px; margin: 12px 0; }
    .feedback { min-height: 22px; margin: 8px 0; color: #ffb4a8; text-align: center; }
    .feedback:empty { display: none; }
    .history-item { width: 100%; color: var(--text); text-align: left; cursor: pointer; }
    .history-item strong { display: block; }
    .history-item span { color: var(--muted); font-size: 13px; }
    .setting-item { display: grid; grid-template-columns: 38px 1fr; gap: 11px; align-items: center; margin-bottom: 9px; }
    .setting-item input { width: 100%; background: #0f0d0b; border: 1px solid #4a3a2b; border-radius: 9px; padding: 10px; color: var(--text); }
    .update-notice { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); width: min(calc(100% - 24px), 406px); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 12px 11px 15px; transform: translateX(-50%); background: #21170f; border: 1px solid var(--gold-soft); border-radius: 12px; box-shadow: 0 12px 30px #0009; color: var(--text); font-size: 14px; z-index: 30; }
    .update-notice[hidden] { display: none; }
    .update-notice button { flex: 0 0 auto; border: 1px solid #ef4438; border-radius: 8px; padding: 7px 10px; background: var(--red); color: #fff; font-weight: 800; }
    .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; background: #f5e6c8; color: #2a1d11; border-radius: 10px; padding: 10px 16px; font-weight: 700; transition: .2s; z-index: 20; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (prefers-reduced-motion: reduce) { .tab-bar, .disclosure-icon { transition: none; } }
    @media (max-width: 480px) {
      .preview-shell { padding: 0 0 env(safe-area-inset-bottom); }
      .phone { width: 100%; min-height: 100dvh; border: 0; border-radius: 0; }
      .screen { min-height: 100dvh; }
    }
    @media (max-width: 480px) and (min-height: 800px) {
      .app-bar { min-height: 52px; padding: 8px 14px; }
      .app-bar h1 { font-size: 19px; }
      .session-content { padding: 10px 12px calc(8px + env(safe-area-inset-bottom)); }
      .score-grid { gap: 6px; }
      .score-card { padding: 9px 5px 8px; border-top-width: 3px; }
      .player-name { font-size: 16px; }
      .score { margin-top: 4px; font-size: 23px; }
      .toolbar { gap: 6px; margin: 8px 0; }
      .toolbar button { min-height: 44px; padding: 8px 5px; }
      .scoring-title { margin: 8px 0 5px; }
      .scoring-card { padding: 9px 10px 10px; border-radius: 12px; }
      .scoring-card .section-title { margin: 7px 0 4px; }
      .scoring-card .btn-option, .scoring-card .toggle { min-height: 42px; padding: 7px 5px; }
      .scoring-card .landlord-option { padding: 6px 4px 7px; }
      .bomb-control-row { margin-top: 5px; }
      .feedback { min-height: 0; margin: 4px 0; font-size: 13px; }
      #confirm-round { min-height: 46px; padding: 9px 14px; }
    }
  </style>
</head>
<body>
<div class="preview-shell">
  <button id="preview-menu-handle" class="preview-menu-handle" type="button"
          aria-expanded="false" aria-controls="preview-menu">
    <span class="handle-bar" aria-hidden="true"></span>
    <span class="sr-only">显示预览页面菜单</span>
  </button>
  <nav id="preview-menu" class="tab-bar" aria-label="预览页面" aria-hidden="true" inert>
    <button class="active" data-screen="home-empty">首页(空)</button>
    <button data-screen="home-session">首页(对局中)</button>
    <button data-screen="new-session">新建场次</button>
    <button data-screen="history">历史场次</button>
    <button data-screen="detail">场次详情</button>
    <button data-screen="settings">设置</button>
  </nav>

  <main class="phone">
    <section class="screen active" id="screen-home-empty">
      <header class="app-bar">
        <h1>斗地主记分</h1>
        <div class="actions">
          <button class="icon-btn internal-history" aria-label="历史">📅</button>
          <button class="icon-btn internal-settings" aria-label="设置">⚙</button>
        </div>
      </header>
      <div class="content hero">
        <div class="hero-symbol">♠</div>
        <h2>开战</h2>
        <p>选择三位玩家开始记分</p>
        <button class="primary start-btn">新建场次</button>
      </div>
    </section>

    <section class="screen" id="screen-home-session">
      <header class="app-bar">
        <h1>斗地主记分</h1>
        <div class="actions">
          <button class="icon-btn internal-history" aria-label="历史">📅</button>
          <button class="icon-btn internal-settings" aria-label="设置">⚙</button>
        </div>
      </header>
      <div class="content session-content">
        <div id="session-empty-note" class="card empty-card">暂无进行中的场次</div>
        <div id="session-workspace">
          <div id="score-grid" class="score-grid"></div>
          <div class="toolbar">
            <button id="new-session-during" class="secondary">新建场次</button>
            <button id="undo-last-round" class="secondary" disabled>撤回上一局</button>
            <button id="end-session" class="danger">结束场次</button>
          </div>
          <button id="recent-rounds-toggle" class="recent-rounds-toggle" type="button"
                  aria-expanded="false" aria-controls="recent-rounds">
            <span class="recent-rounds-label">最近三局</span>
            <span id="recent-rounds-summary" class="recent-rounds-summary">暂无记录</span>
            <span class="disclosure-icon" aria-hidden="true">⌄</span>
          </button>
          <div id="recent-rounds" hidden></div>
          <h2 class="section-title scoring-title">本局记分</h2>
          <div class="card scoring-card">
            <div class="muted">选择地主</div>
            <div id="landlord-options" class="option-grid"></div>
            <div class="muted section-title">胜负</div>
            <div class="toggle-grid">
              <button id="landlord-win" class="toggle">地主赢</button>
              <button id="landlord-loss" class="toggle">地主输</button>
            </div>
            <div class="muted section-title">踢 / 反踢</div>
            <div id="kick-options" class="option-grid"></div>
            <div class="bomb-control-row">
              <span class="muted">炸弹数</span>
              <div class="bomb-row">
                <button id="bomb-minus" aria-label="减少炸弹">−</button>
                <strong id="bomb-count">0</strong>
                <button id="bomb-plus" aria-label="增加炸弹">＋</button>
              </div>
            </div>
            <div id="round-feedback" class="feedback" aria-live="polite"></div>
            <button id="confirm-round" class="primary wide" disabled>确认记分</button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-new-session">
      <header class="app-bar"><button class="back-btn go-home">← 返回</button><h1>新建场次</h1><span></span></header>
      <div class="content">
        <p class="hint">请选择恰好三位玩家</p>
        <div class="player-list">
          <div class="card player-item" data-player-id="p1"><span class="avatar" style="background:#e53935">张</span><strong>张三</strong><span class="check-icon">○</span></div>
          <div class="card player-item" data-player-id="p2"><span class="avatar" style="background:#1e88e5">李</span><strong>李四</strong><span class="check-icon">○</span></div>
          <div class="card player-item" data-player-id="p3"><span class="avatar" style="background:#43a047">王</span><strong>王五</strong><span class="check-icon">○</span></div>
          <div class="card player-item" data-player-id="p4"><span class="avatar" style="background:#fb8c00">赵</span><strong>赵六</strong><span class="check-icon">○</span></div>
          <div class="card player-item" data-player-id="p5"><span class="avatar" style="background:#8e24aa">孙</span><strong>孙七</strong><span class="check-icon">○</span></div>
        </div>
        <div id="selection-status" class="selection-status">已选择 0/3</div>
        <button id="start-session" class="primary wide" disabled>开始（请选择 3 位玩家）</button>
      </div>
    </section>

    <section class="screen" id="screen-history">
      <header class="app-bar"><button class="back-btn go-home">← 返回</button><h1>历史场次</h1><span></span></header>
      <div class="content"><div id="history-list"></div></div>
    </section>

    <section class="screen" id="screen-detail">
      <header class="app-bar"><button class="back-btn go-history">← 返回</button><h1>场次详情</h1><span></span></header>
      <div class="content" id="detail-content"></div>
    </section>

    <section class="screen" id="screen-settings">
      <header class="app-bar"><button class="back-btn go-home">← 返回</button><h1>设置</h1><span></span></header>
      <div class="content">
        <p class="hint">修改玩家姓名。旧历史场次会保留当时的姓名。</p>
        <div id="settings-list">
          <label class="card setting-item"><span class="avatar" style="background:#e53935">张</span><input data-player-id="p1" value="张三" maxlength="12"></label>
          <label class="card setting-item"><span class="avatar" style="background:#1e88e5">李</span><input data-player-id="p2" value="李四" maxlength="12"></label>
          <label class="card setting-item"><span class="avatar" style="background:#43a047">王</span><input data-player-id="p3" value="王五" maxlength="12"></label>
          <label class="card setting-item"><span class="avatar" style="background:#fb8c00">赵</span><input data-player-id="p4" value="赵六" maxlength="12"></label>
          <label class="card setting-item"><span class="avatar" style="background:#8e24aa">孙</span><input data-player-id="p5" value="孙七" maxlength="12"></label>
        </div>
        <button id="save-settings" class="primary wide">保存设置</button>
      </div>
    </section>
  </main>
</div>
<div id="pwa-update" class="update-notice" role="status" hidden>
  <span>发现新版本，可以立即更新。</span>
  <button id="pwa-update-now" type="button">立即更新</button>
</div>
<div id="toast" class="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const STORAGE_KEY = 'doudizhu_state';
  const SCHEMA_VERSION = 1;
  let storageRecovered = false;
  let selectedPlayerIds = [];
  let selectedHistoryId = null;

  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function makeId(prefix) { return prefix + '-' + Date.now() + '-' + Math.random().toString(16).slice(2); }
  function defaultDraft() {
    return { landlordId: null, isLandlordWin: null, spring: false, blind: false, kickStates: {}, bombCount: 0 };
  }
  function defaultState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      players: [
        { id: 'p1', name: '张三', color: '#e53935' },
        { id: 'p2', name: '李四', color: '#1e88e5' },
        { id: 'p3', name: '王五', color: '#43a047' },
        { id: 'p4', name: '赵六', color: '#fb8c00' },
        { id: 'p5', name: '孙七', color: '#8e24aa' }
      ],
      activeSession: null,
      history: [],
      draftRound: defaultDraft()
    };
  }
  function isValidState(value) {
    return value && value.schemaVersion === SCHEMA_VERSION && Array.isArray(value.players) &&
      value.players.length === 5 && Array.isArray(value.history) && 'activeSession' in value &&
      value.draftRound && typeof value.draftRound === 'object';
  }
  function saveState(storage, value) { storage.setItem(STORAGE_KEY, JSON.stringify(value)); }
  function loadState(storage) {
    const raw = storage.getItem(STORAGE_KEY);
    if (!raw) return defaultState();
    try {
      const parsed = JSON.parse(raw);
      if (!isValidState(parsed)) throw new Error('schema');
      return parsed;
    } catch (_) {
      storageRecovered = true;
      return defaultState();
    }
  }
  function calcBaseScore(n) { return n <= 5 ? 10 * (1 << n) : 320 + (n - 5) * 100; }
  function calcRoundScores(options) {
    const nBase = (options.spring ? 1 : 0) + (options.blind ? 1 : 0) + Number(options.bombCount || 0);
    const base = calcBaseScore(nBase);
    const farmerAKickCount = Number(options.farmerAKickCount != null ? options.farmerAKickCount : (options.kickCount || 0));
    const farmerBKickCount = Number(options.farmerBKickCount || 0);
    const farmerAScoreBase = farmerAKickCount > 0 ? calcBaseScore(nBase + farmerAKickCount) : base;
    const farmerBScoreBase = farmerBKickCount > 0 ? calcBaseScore(nBase + farmerBKickCount) : base;
    let farmerAScore = -Math.trunc(farmerAScoreBase / 2);
    let farmerBScore = -Math.trunc(farmerBScoreBase / 2);
    let landlordScore = -(farmerAScore + farmerBScore);
    if (!options.isLandlordWin) {
      landlordScore = -landlordScore; farmerAScore = -farmerAScore; farmerBScore = -farmerBScore;
    }
    return { landlordScore, farmerAScore, farmerBScore };
  }
  function createSession(current, playerIds) {
    const ids = Array.from(new Set(playerIds || []));
    if (ids.length !== 3 || ids.some(id => !current.players.some(p => p.id === id))) throw new Error('必须选择恰好 3 位玩家');
    const next = clone(current);
    const totals = {}; ids.forEach(id => { totals[id] = 0; });
    next.activeSession = { id: makeId('session'), playerIds: ids, totals, rounds: [], startedAt: new Date().toISOString() };
    next.draftRound = defaultDraft();
    return next;
  }
  function confirmRound(current, draft) {
    if (!current.activeSession) throw new Error('当前没有场次');
    if (!draft.landlordId || typeof draft.isLandlordWin !== 'boolean') throw new Error('请选择地主和胜负');
    if (!current.activeSession.playerIds.includes(draft.landlordId)) throw new Error('地主不在当前场次');
    const next = clone(current);
    const farmers = next.activeSession.playerIds.filter(id => id !== draft.landlordId);
    const farmerA = farmers[0], farmerB = farmers[1];
    const kickStates = {};
    farmers.forEach(id => {
      const legacyValue = draft.kickFarmer === id ? Number(draft.kickCount || 0) : 0;
      kickStates[id] = Math.max(0, Math.min(2, Number((draft.kickStates || {})[id] != null ? draft.kickStates[id] : legacyValue)));
    });
    const result = calcRoundScores({
      ...draft,
      farmerAKickCount: kickStates[farmerA],
      farmerBKickCount: kickStates[farmerB]
    });
    const scores = {};
    scores[draft.landlordId] = result.landlordScore;
    scores[farmerA] = result.farmerAScore;
    scores[farmerB] = result.farmerBScore;
    next.activeSession.playerIds.forEach(id => { next.activeSession.totals[id] += scores[id]; });
    next.activeSession.rounds.push({
      id: makeId('round'), index: next.activeSession.rounds.length + 1, createdAt: new Date().toISOString(),
      landlordId: draft.landlordId, isLandlordWin: draft.isLandlordWin, spring: !!draft.spring,
      blind: !!draft.blind, kickStates,
      bombCount: Number(draft.bombCount || 0), scores
    });
    next.draftRound = defaultDraft();
    return next;
  }
  function undoLastRound(current) {
    if (!current.activeSession || !current.activeSession.rounds.length) throw new Error('没有可撤回的记分记录');
    const next = clone(current);
    const round = next.activeSession.rounds.pop();
    next.activeSession.playerIds.forEach(id => {
      next.activeSession.totals[id] -= Number(round.scores[id] || 0);
    });
    next.draftRound = {
      landlordId: round.landlordId,
      isLandlordWin: round.isLandlordWin,
      spring: false,
      blind: false,
      kickStates: clone(round.kickStates || {}),
      bombCount: Number(round.bombCount || 0)
    };
    return next;
  }
  function endSession(current) {
    if (!current.activeSession) throw new Error('当前没有场次');
    const next = clone(current);
    const session = clone(next.activeSession);
    session.endedAt = new Date().toISOString();
    session.players = session.playerIds.map(id => clone(next.players.find(p => p.id === id)));
    next.history.unshift(session);
    next.activeSession = null;
    next.draftRound = defaultDraft();
    return next;
  }

  function canUseServiceWorker(locationObj, navigatorObj) {
    if (!navigatorObj || !('serviceWorker' in navigatorObj)) return false;
    return locationObj.protocol === 'https:' ||
      (locationObj.protocol === 'http:' && (locationObj.hostname === 'localhost' || locationObj.hostname === '127.0.0.1'));
  }
  async function setupPwaUpdates(deps) {
    const { navigatorObj, windowObj, locationObj, documentObj, banner, updateButton } = deps;
    if (!canUseServiceWorker(locationObj, navigatorObj)) return null;
    try {
      const registration = await navigatorObj.serviceWorker.register('./sw.js', { scope: './' });
      let refreshing = false;
      let updateRequested = false;
      const showWaiting = () => {
        if (!registration.waiting || !banner) return;
        banner.hidden = false;
      };
      showWaiting();
      registration.addEventListener('updatefound', () => {
        const installing = registration.installing;
        if (!installing) return;
        installing.addEventListener('statechange', () => {
          if (installing.state === 'installed' && navigatorObj.serviceWorker.controller) showWaiting();
        });
      });
      if (updateButton) updateButton.addEventListener('click', () => {
        if (!registration.waiting) return;
        try {
          registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          updateRequested = true;
        } catch (_) {}
      });
      navigatorObj.serviceWorker.addEventListener('controllerchange', () => {
        if (!updateRequested || refreshing) return;
        refreshing = true;
        windowObj.location.reload();
      });
      const check = () => registration.update().catch(() => {});
      check();
      windowObj.addEventListener('online', check);
      if (documentObj && typeof documentObj.addEventListener === 'function') {
        documentObj.addEventListener('visibilitychange', () => {
          if (documentObj.visibilityState === 'visible') check();
        });
      }
      return registration;
    } catch (_) {
      return null;
    }
  }

  window.previewApp = { STORAGE_KEY, defaultState, loadState, saveState, calcBaseScore, calcRoundScores, createSession, confirmRound, undoLastRound, endSession, canUseServiceWorker, setupPwaUpdates, setPreviewMenuOpen, shouldRevealPreviewMenu };
  let appState = loadState(localStorage);

  function byId(id) { return document.getElementById(id); }
  function playerById(id) { return appState.players.find(p => p.id === id); }
  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
  }
  function showToast(message) {
    const el = byId('toast'); if (!el) return;
    el.textContent = message; el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1800);
  }
  function shouldRevealPreviewMenu(startY, currentY, scrollY) {
    return Number(scrollY) <= 0 && Number(currentY) - Number(startY) >= 48;
  }
  function setPreviewMenuOpen(open) {
    const menu = byId('preview-menu');
    const handle = byId('preview-menu-handle');
    const expanded = !!open;
    handle.setAttribute('aria-expanded', String(expanded));
    handle.querySelector('.sr-only').textContent =
      expanded ? '隐藏预览页面菜单' : '显示预览页面菜单';
    menu.setAttribute('aria-hidden', String(!expanded));
    menu.inert = !expanded;
    menu.classList.toggle('open', expanded);
  }
  function syncTabs(id) {
    document.querySelectorAll('.tab-bar button').forEach(button => button.classList.toggle('active', button.getAttribute('data-screen') === id));
  }
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(screen => screen.classList.remove('active'));
    const target = byId('screen-' + id); if (target) target.classList.add('active');
    syncTabs(id);
    renderScreen(id);
  }
  function goHome() { showScreen(appState.activeSession ? 'home-session' : 'home-empty'); }
  function persist() { saveState(localStorage, appState); }
  function ask(message) { return typeof confirm === 'function' ? confirm(message) : true; }
  function formatTime(value) {
    try { return new Date(value).toLocaleString('zh-CN', { hour12: false }); } catch (_) { return value || ''; }
  }
  function renderScreen(id) {
    if (id === 'home-session') renderHomeSession();
    if (id === 'new-session') renderNewSession();
    if (id === 'history') renderHistory();
    if (id === 'detail') renderDetail();
    if (id === 'settings') renderSettings();
  }
  function renderNewSession() {
    document.querySelectorAll('#screen-new-session .player-item').forEach(item => {
      const player = playerById(item.getAttribute('data-player-id'));
      const checked = selectedPlayerIds.includes(player.id);
      const strong = item.querySelector('strong'); if (strong) strong.textContent = player.name;
      const avatar = item.querySelector('.avatar'); if (avatar) { avatar.textContent = player.name.slice(0,1); avatar.style.background = player.color; }
      const icon = item.querySelector('.check-icon'); if (icon) icon.textContent = checked ? '✓' : '○';
      item.classList.toggle('checked', checked);
    });
    const count = selectedPlayerIds.length;
    const status = byId('selection-status'); if (status) status.textContent = count === 3 ? '已选择 3/3，可以开始' : '已选择 ' + count + '/3';
    const start = byId('start-session');
    if (start) { start.disabled = count !== 3; start.textContent = count === 3 ? '开始场次' : '开始（请选择 3 位玩家）'; }
  }
  let recentRoundsExpanded = false;

  function setRecentRoundsExpanded(expanded) {
    recentRoundsExpanded = !!expanded;
    const toggle = byId('recent-rounds-toggle');
    const list = byId('recent-rounds');
    if (!toggle || !list) return;
    toggle.setAttribute('aria-expanded', String(recentRoundsExpanded));
    if (recentRoundsExpanded) list.removeAttribute('hidden');
    else list.setAttribute('hidden', '');
  }

  function renderHomeSession() {
    const session = appState.activeSession;
    const empty = byId('session-empty-note'), workspace = byId('session-workspace');
    if (!session) {
      if (empty) empty.style.display = 'block';
      if (workspace) workspace.style.display = 'none';
      return;
    }
    if (empty) empty.style.display = 'none';
    if (workspace) workspace.style.display = 'block';
    byId('score-grid').innerHTML = session.playerIds.map(id => {
      const p = playerById(id); const score = session.totals[id] || 0;
      const polarity = score > 0 ? 'positive' : (score < 0 ? 'negative' : 'zero');
      return '<div class="card score-card" style="--player-color:'+p.color+'"><strong class="player-name">'+escapeHtml(p.name)+'</strong><div class="score '+polarity+'">'+(score > 0 ? '+' : '')+score+'</div></div>';
    }).join('');
    const recent = session.rounds.slice(-3).reverse();
    byId('undo-last-round').disabled = session.rounds.length === 0;
    byId('recent-rounds').innerHTML = recent.length ? recent.map(round =>
      '<div class="card round-row"><span>第 '+round.index+' 局 · '+escapeHtml(playerById(round.landlordId).name)+'地主</span><strong>'+(round.isLandlordWin?'胜':'负')+'</strong></div>'
    ).join('') : '<div class="card empty-card">还没有记分记录</div>';
    const summary = byId('recent-rounds-summary');
    summary.textContent = recent.length
      ? '第 ' + recent[0].index + ' 局 · ' + playerById(recent[0].landlordId).name +
        '地主 ' + (recent[0].isLandlordWin ? '胜' : '负')
      : '暂无记录';
    setRecentRoundsExpanded(false);
    renderDraft();
  }
  function renderDraft() {
    const session = appState.activeSession; if (!session) return;
    const draft = appState.draftRound;
    const hadLegacyBoost = !!draft.spring || !!draft.blind;
    draft.spring = false;
    draft.blind = false;
    if (!draft.kickStates || typeof draft.kickStates !== 'object') {
      draft.kickStates = {};
      if (draft.kickFarmer && draft.kickCount) draft.kickStates[draft.kickFarmer] = Number(draft.kickCount);
    }
    const landlords = byId('landlord-options');
    landlords.innerHTML = '';
    session.playerIds.forEach(id => {
      const p = playerById(id), button = document.createElement('button');
      button.setAttribute('class', 'btn-option landlord-option' + (draft.landlordId === id ? ' selected' : ''));
      button.setAttribute('style', '--player-color:' + p.color);
      const dot = document.createElement('span');
      dot.setAttribute('class', 'player-dot');
      const label = document.createElement('span');
      label.setAttribute('class', 'player-label');
      label.textContent = p.name;
      button.appendChild(dot);
      button.appendChild(label);
      button.addEventListener('click', () => {
        draft.landlordId = id;
        delete draft.kickStates[id];
        persist(); renderDraft();
      });
      landlords.appendChild(button);
    });
    byId('landlord-win').classList.toggle('selected', draft.isLandlordWin === true);
    byId('landlord-loss').classList.toggle('selected', draft.isLandlordWin === false);
    byId('bomb-count').textContent = String(draft.bombCount);
    byId('bomb-minus').disabled = draft.bombCount <= 0;
    const kicks = byId('kick-options'); kicks.innerHTML = '';
    if (draft.landlordId) {
      session.playerIds.filter(id => id !== draft.landlordId).forEach(id => {
        const p = playerById(id), button = document.createElement('button');
        const currentState = Math.max(0, Math.min(2, Number(draft.kickStates[id] || 0)));
        const active = currentState > 0;
        const stateLabel = ['不踢', '踢', '反踢'][currentState];
        button.setAttribute('class', 'btn-option' + (active ? ' selected' : ''));
        button.textContent = p.name + '：' + stateLabel;
        button.addEventListener('click', () => {
          draft.kickStates[id] = (currentState + 1) % 3;
          persist(); renderDraft();
        });
        kicks.appendChild(button);
      });
    } else {
      kicks.textContent = '请先选择地主';
    }
    const ready = !!draft.landlordId && typeof draft.isLandlordWin === 'boolean';
    byId('confirm-round').disabled = !ready;
    if (hadLegacyBoost) persist();
  }
  function renderHistory() {
    const list = byId('history-list');
    if (!appState.history.length) { list.innerHTML = '<div class="card empty-card">暂无历史场次</div>'; return; }
    list.innerHTML = '';
    appState.history.forEach(session => {
      const button = document.createElement('button');
      button.className = 'card history-item';
      button.innerHTML = '<div><strong>'+escapeHtml(session.players.map(p=>p.name).join('、'))+'</strong><span>'+escapeHtml(formatTime(session.endedAt || session.startedAt))+' · '+session.rounds.length+' 局</span></div><b>›</b>';
      button.addEventListener('click', () => { selectedHistoryId = session.id; showScreen('detail'); });
      list.appendChild(button);
    });
  }
  function renderDetail() {
    let session = appState.history.find(item => item.id === selectedHistoryId);
    if (!session) session = appState.history[0] || appState.activeSession;
    const root = byId('detail-content');
    if (!session) { root.innerHTML = '<div class="card empty-card">暂无场次详情</div>'; return; }
    const snapshots = session.players || session.playerIds.map(id => playerById(id));
    root.innerHTML =
      '<div class="card"><div class="muted">'+escapeHtml(formatTime(session.startedAt))+'</div><div class="score-grid">'+
      snapshots.map(p => '<div class="score-card"><strong>'+escapeHtml(p.name)+'</strong><div class="score">'+(session.totals[p.id]||0)+'</div></div>').join('')+
      '</div></div><h2 class="section-title">全部记录</h2>'+
      (session.rounds.length ? session.rounds.slice().reverse().map(round => '<div class="card round-row"><span>第 '+round.index+' 局 · '+escapeHtml((snapshots.find(p=>p.id===round.landlordId)||{name:'?'}).name)+'地主</span><strong>'+(round.isLandlordWin?'胜':'负')+'</strong></div>').join('') : '<div class="card empty-card">没有局记录</div>');
  }
  function renderSettings() {
    document.querySelectorAll('#settings-list input').forEach(input => {
      const p = playerById(input.getAttribute('data-player-id')); if (p) input.value = p.name;
    });
  }

  byId('preview-menu-handle').addEventListener('click', () => {
    setPreviewMenuOpen(byId('preview-menu-handle').getAttribute('aria-expanded') !== 'true');
  });
  document.querySelectorAll('.tab-bar button').forEach(button => button.addEventListener('click', () => {
    showScreen(button.getAttribute('data-screen'));
    setPreviewMenuOpen(false);
  }));
  if (window.addEventListener) {
    let previewPullStartY = null;
    window.addEventListener('touchstart', touchEvent => {
      previewPullStartY = touchEvent.touches && touchEvent.touches[0]
        ? touchEvent.touches[0].clientY : null;
    }, { passive: true });
    window.addEventListener('touchmove', touchEvent => {
      const touch = touchEvent.touches && touchEvent.touches[0];
      if (touch && previewPullStartY != null &&
          shouldRevealPreviewMenu(previewPullStartY, touch.clientY, window.scrollY || 0)) {
        setPreviewMenuOpen(true);
        previewPullStartY = null;
      }
    }, { passive: true });
  }
  document.querySelectorAll('.start-btn').forEach(button => button.addEventListener('click', () => { selectedPlayerIds = []; showScreen('new-session'); }));
  document.querySelectorAll('.internal-history').forEach(button => button.addEventListener('click', () => showScreen('history')));
  document.querySelectorAll('.internal-settings').forEach(button => button.addEventListener('click', () => showScreen('settings')));
  document.querySelectorAll('.go-home').forEach(button => button.addEventListener('click', goHome));
  document.querySelectorAll('.go-history').forEach(button => button.addEventListener('click', () => showScreen('history')));
  document.querySelectorAll('#screen-new-session .player-item').forEach(item => item.addEventListener('click', () => {
    const id = item.getAttribute('data-player-id'), index = selectedPlayerIds.indexOf(id);
    if (index >= 0) selectedPlayerIds.splice(index, 1);
    else if (selectedPlayerIds.length < 3) selectedPlayerIds.push(id);
    else showToast('最多只能选择三位玩家');
    renderNewSession();
  }));
  byId('start-session').addEventListener('click', () => {
    if (selectedPlayerIds.length !== 3) { byId('selection-status').textContent = '必须选择恰好三位玩家'; return; }
    if (appState.activeSession && !ask('当前场次尚未结束，确定覆盖并新建吗？')) return;
    appState = createSession(appState, selectedPlayerIds); persist(); showScreen('home-session'); showToast('场次已开始');
  });
  byId('new-session-during').addEventListener('click', () => {
    if (appState.activeSession && !ask('当前场次尚未结束，确定新建并覆盖吗？')) return;
    selectedPlayerIds = []; showScreen('new-session');
  });
  byId('end-session').addEventListener('click', () => {
    if (!appState.activeSession || !ask('确定结束当前场次吗？结束后可在历史中查看。')) return;
    appState = endSession(appState); persist(); showScreen('history'); showToast('场次已结束');
  });
  byId('undo-last-round').addEventListener('click', () => {
    if (!appState.activeSession || !appState.activeSession.rounds.length) return;
    if (!ask('确定撤回上一局吗？累计分会回滚，并恢复该局的记分选项。')) return;
    appState = undoLastRound(appState);
    persist();
    renderHomeSession();
    byId('round-feedback').textContent = '上一局已撤回，可修改后重新记分';
    showToast('已撤回上一局');
  });
  byId('landlord-win').addEventListener('click', () => { appState.draftRound.isLandlordWin = true; persist(); renderDraft(); });
  byId('landlord-loss').addEventListener('click', () => { appState.draftRound.isLandlordWin = false; persist(); renderDraft(); });
  byId('bomb-minus').addEventListener('click', () => { appState.draftRound.bombCount = Math.max(0, appState.draftRound.bombCount - 1); persist(); renderDraft(); });
  byId('bomb-plus').addEventListener('click', () => { appState.draftRound.bombCount += 1; persist(); renderDraft(); });
  byId('recent-rounds-toggle').addEventListener('click', () => {
    setRecentRoundsExpanded(!recentRoundsExpanded);
  });
  byId('confirm-round').addEventListener('click', () => {
    try { appState = confirmRound(appState, appState.draftRound); persist(); renderHomeSession(); byId('round-feedback').textContent = '记分成功'; showToast('本局已记分'); }
    catch (error) { byId('round-feedback').textContent = error.message; }
  });
  byId('save-settings').addEventListener('click', () => {
    let valid = true;
    document.querySelectorAll('#settings-list input').forEach(input => {
      const name = input.value.trim(); if (!name) { valid = false; return; }
      const p = playerById(input.getAttribute('data-player-id')); if (p) p.name = name;
    });
    if (!valid) { showToast('玩家姓名不能为空'); return; }
    persist(); renderSettings(); showToast('设置已保存');
  });

  renderNewSession();
  if (appState.activeSession) showScreen('home-session'); else showScreen('home-empty');
  if (storageRecovered) { persist(); showToast('检测到损坏数据，已安全恢复默认状态'); }
  if (typeof window.addEventListener === 'function') {
    window.addEventListener('load', () => setupPwaUpdates({
      navigatorObj: window.navigator,
      windowObj: window,
      locationObj: window.location,
      documentObj: document,
      banner: byId('pwa-update'),
      updateButton: byId('pwa-update-now'),
    }));
  }
})();
</script>
</body>
</html>
